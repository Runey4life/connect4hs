# fly.toml — Fly.io configuration for Connect 4
app = "connect4-haskell"        # change this to your chosen app name
primary_region = "fra"          # Frankfurt — change to nearest: lhr, cdg, iad, ord, sjc…

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = true    # spin down when idle (saves free allowance)
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "256mb"
  cpus   = 1
